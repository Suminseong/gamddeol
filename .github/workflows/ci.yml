# PR 검사: 타입 검사 · 단위/통합 테스트 · 배포 빌드(dist 검사 포함) · E2E(로컬 /gamddeol/ 경로, 네트워크 모의).
# 실험(experiments/)은 별도 작업으로 검사한다.
# 비밀값을 쓰지 않는다. 실제 키·원고 없이 돈다.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # 가상 독자 계산 PoC(experiments/). 알파 검사·Pages 배포와 분리된 실험이라 따로 돈다.
  # 원고·외부 API·비밀값을 쓰지 않는다. 수치는 오락용 가정이며 시장 예측이 아니다.
  experiments:
    name: 실험 · 가상 독자 계산 PoC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:experiments
      - run: npm run test:experiments
      - name: V10 예제 표를 작업 요약에 남기기
        shell: bash
        run: npm run --silent poc:readers | tee -a "$GITHUB_STEP_SUMMARY"

  # 머지 전에 Pages 소스 설정을 알려 준다. 검사 결과에는 영향을 주지 않는다.
  pages-source:
    name: Pages 소스 확인 (정보)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)"
          echo "Pages build_type: $build_type"
          echo "- GitHub Pages 소스(build_type): \`$build_type\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$build_type" != "workflow" ]; then
            echo "::warning::GitHub Pages 소스가 GitHub Actions가 아닙니다 (build_type=$build_type). main에 머지해도 Pages 워크플로가 배포하지 않습니다. Settings → Pages에서 Source를 GitHub Actions로 바꾸세요."
          fi
